<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and filter cat breeds by coat, energy, size and personality on CATTALOG.">
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Breeds | CATTALOG</title>
</head>

<body>

<header class="site-header" id="site-header">
</header>


<main>

    <!-- INTRO -->
    <section class="page-intro">

        <img src="images/bat.png" alt="" aria-hidden="true" class="page-decor decor-breeds-bat" loading="lazy">
        <img src="images/spider.png" alt="" aria-hidden="true" class="page-decor decor-intro-spider" loading="lazy">

        <p class="section-label">
            The Cattalog
        </p>

        <h1>All Breeds.</h1>

        <p>
            Every breed has a character.
            Explore them all and find your favorites.
        </p>

        <p class="breed-count-summary" id="breed-count-summary"></p>

    </section>


    <!-- BREED BROWSER -->
    <section class="breed-browser">

        <img src="images/spider2.png" alt="" aria-hidden="true" class="page-decor decor-grid-spider" loading="lazy">

        <!--
            JavaScript builds the search input
            and filter selects here.
        -->
        <div id="breed-filter-ui">
        </div>


        <p class="breed-results-count" id="breed-results-count"></p>


        <!--
            JavaScript will create ALL breed cards
            from breeds.json here.
        -->
        <div class="breed-grid" id="breed-grid">
        </div>

    </section>


    <!-- QUIZ CTA -->
    <section class="match-section">

        <img src="images/cat-skeleton.png" alt="" aria-hidden="true" class="page-decor decor-match-skeleton" loading="lazy">
        <img src="images/spider2.png" alt="" aria-hidden="true" class="page-decor decor-cta-spider2" loading="lazy">

        <div class="match-content">

            <p class="section-label">
                Still Deciding?
            </p>

            <h2>
                Let us find your match.
            </h2>

            <p>
                Answer a few quick questions about your lifestyle
                and we'll match you with your purrfect breed.
            </p>

            <a href="match.html" class="button">
                Start the Quiz
            </a>

        </div>

    </section>

</main>


<footer class="site-footer" id="site-footer">
</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/breeds.js"></script>
</body>

</html>
