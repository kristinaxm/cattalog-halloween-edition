<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and filter cat breeds by coat, energy, size and personality on CATTALOG.">
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Breeds | CATTALOG</title>
</head>

<body>

<header class="site-header" id="site-header">
</header>


<main>

    <!-- INTRO -->
    <section class="page-intro">

        <p class="section-label">
            The Cattalog
        </p>

        <h1>All Breeds.</h1>

        <p>
            Every breed has a character.
            Explore them all and find your favorites.
        </p>

    </section>


    <!-- BREED BROWSER -->
    <section class="breed-browser">

        <!--
            JavaScript builds the search input
            and filter selects here.
        -->
        <div id="breed-filter-ui">
        </div>


        <!--
            JavaScript will create ALL breed cards
            from breeds.json here.
        -->
        <div class="breed-grid" id="breed-grid">
        </div>

    </section>

</main>


<footer class="site-footer" id="site-footer">
</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/breeds.js"></script>
</body>

</html>
