<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and filter cat breeds by coat, energy, size and personality on CATTALOG.">
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Breeds | CATTALOG</title>
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">
        CATTALOG
    </a>

    <button
            type="button"
            class="nav-toggle"
            id="nav-toggle"
            aria-expanded="false"
            aria-controls="main-nav"
            aria-label="Open menu">
        ☰
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="breeds.html" aria-current="page">Breeds</a>
        <a href="match.html">Find Your Match</a>
        <a href="favorites.html">♡ Favorites</a>
    </nav>

</header>


<main>

    <!-- INTRO -->
    <section class="page-intro">

        <p class="section-label">
            The Cattalog
        </p>

        <h1>All Breeds.</h1>

        <p>
            Every breed has a character.
            Explore them all and find your favorites.
        </p>

    </section>


    <!-- BREED BROWSER -->
    <section class="breed-browser">

        <!-- SEARCH -->
        <div class="breed-search">

            <label for="breed-search">
                Search breeds
            </label>

            <input
                    type="search"
                    id="breed-search"
                    placeholder="Search breeds..."
            >

        </div>


        <!-- FILTERS -->
        <div class="breed-filters">

            <div class="filter-group">

                <label for="coat-filter">
                    Coat type
                </label>

                <select id="coat-filter">
                    <option value="all">All</option>
                    <option value="short">Short hair</option>
                    <option value="medium">Medium hair</option>
                    <option value="long">Long hair</option>
                    <option value="hairless">Hairless</option>
                </select>

            </div>


            <div class="filter-group">

                <label for="energy-filter">
                    Energy level
                </label>

                <select id="energy-filter">
                    <option value="all">All</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

            </div>


            <div class="filter-group">

                <label for="size-filter">
                    Size
                </label>

                <select id="size-filter">
                    <option value="all">All</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                </select>

            </div>


            <div class="filter-group">

                <label for="personality-filter">
                    Personality
                </label>

                <select id="personality-filter">
                    <option value="all">All</option>
                    <option value="social">Social</option>
                    <option value="independent">Independent</option>
                    <option value="affectionate">Affectionate</option>
                    <option value="playful">Playful</option>
                    <option value="calm">Calm</option>
                </select>

            </div>

        </div>


        <!--
            JavaScript will create ALL breed cards
            from breeds.json here.
        -->
        <div class="breed-grid" id="breed-grid">
        </div>

    </section>

</main>


<footer class="site-footer">

    <nav class="footer-nav" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="breeds.html" aria-current="page">Breeds</a>
        <a href="match.html">Find Your Match</a>
        <a href="favorites.html">♡ Favorites</a>
    </nav>

    <p>&copy; 2026 CATTALOG</p>

</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/breeds.js"></script>
</body>

</html>
