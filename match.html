<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Take the CATTALOG quiz to find which cat breed matches your lifestyle.">
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Find Your Match | CATTALOG</title>
</head>

<body>

<header class="site-header" id="site-header">
</header>


<main>

    <section class="quiz-section">

        <header class="quiz-header">

            <p class="section-label">
                Cattalog Matchmaker
            </p>

            <h1>
                Find Your Match.
            </h1>

            <p>
                Five questions. No wrong answers.
                Find the characters that fit your lifestyle.
            </p>

        </header>


        <div class="quiz-body">

            <div class="quiz-progress-track" aria-hidden="true">
                <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
            </div>

            <div class="quiz-nav">
                <p class="quiz-progress" id="quiz-progress">
                    Loading question...
                </p>

                <button
                        type="button"
                        class="quiz-back"
                        id="quiz-back"
                        hidden>
                    ← Back
                </button>
            </div>

            <fieldset id="quiz-fieldset">
                <!-- JavaScript adds the current question here -->
            </fieldset>

        </div>

    </section>

</main>


<footer class="site-footer" id="site-footer">
</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/match.js"></script>

</body>

</html>
