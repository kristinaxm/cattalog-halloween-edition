<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Take the CATTALOG quiz to find which cat breed matches your lifestyle.">
    <link rel="icon" href="images/cat-on-skull.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Which Cat Is Your Familiar? | CATTALOG — Halloween Edition</title>
</head>

<body>

<header class="site-header" id="site-header">
</header>


<main>

    <section class="quiz-section">

        <header class="quiz-header">

            <img src="images/bat2.png" alt="" aria-hidden="true" class="page-decor decor-quiz-bat" loading="lazy">

            <p class="section-label">
                Cattalog Matchmaker
            </p>

            <h1>
                Which cat is your familiar?
            </h1>

            <p>
                Five questions. No wrong answers.
                Find the character that fits your lifestyle after dark.
            </p>

        </header>


        <div class="quiz-body">

            <div class="quiz-progress-track" aria-hidden="true">
                <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
            </div>

            <div class="quiz-nav">
                <p class="quiz-progress" id="quiz-progress">
                    Loading question...
                </p>

                <button
                        type="button"
                        class="quiz-back"
                        id="quiz-back"
                        hidden>
                    ← Back
                </button>
            </div>

            <fieldset id="quiz-fieldset">
                <!-- JavaScript adds the current question here -->
            </fieldset>

        </div>


        <!-- MATCH HISTORY -->
        <div class="quiz-history">

            <button
                    type="button"
                    class="history-toggle"
                    id="history-toggle"
                    aria-expanded="false"
                    aria-controls="match-history-panel"
                    hidden>
                View Past Matches
            </button>

        </div>

        <div
                class="match-history"
                id="match-history-panel"
                hidden>

            <div class="match-history-header">

                <h2>
                    Your Past Matches.
                </h2>

                <button
                        type="button"
                        class="clear-history-button"
                        id="clear-history-button"
                        hidden>
                    Clear History
                </button>

            </div>

            <div class="history-list" id="match-history-list">
                <!-- JavaScript adds past match entries here -->
            </div>

        </div>

        <img src="images/cat-skeleton.png" alt="" aria-hidden="true" class="page-decor decor-quiz-skeleton" loading="lazy">

    </section>

</main>


<footer class="site-footer" id="site-footer">
</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/match.js"></script>

</body>

</html>
