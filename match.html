<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Match | CATTALOG</title>
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">
        CATTALOG
    </a>

    <nav class="main-nav" aria-label="Main navigation">
        <a href="breeds.html">Breeds</a>
        <a href="match.html">Find Your Match</a>
        <a href="favorites.html">♡ Favorites</a>
    </nav>

</header>


<main>

    <section class="quiz-section">

        <header class="quiz-header">

            <p class="section-label">
                Cattalog Matchmaker
            </p>

            <h1>
                Find Your Match.
            </h1>

            <p>
                Five questions. No wrong answers.
                Find the characters that fit your lifestyle.
            </p>

        </header>


        <form id="match-form">

            <p class="quiz-progress">
                Question 1 of 5
            </p>


            <fieldset>

                <legend>
                    What's your energy?
                </legend>

                <p>
                    How active do you want your cat to be?
                </p>


                <label>

                    <input
                            type="radio"
                            name="energy"
                            value="low">

                    Low — Professional napper.

                </label>


                <label>

                    <input
                            type="radio"
                            name="energy"
                            value="medium">

                    Medium — Play now. Nap later.

                </label>


                <label>

                    <input
                            type="radio"
                            name="energy"
                            value="high">

                    High — Chaos is a lifestyle.

                </label>

            </fieldset>


            <!-- JS validation message later -->
            <p
                    class="form-error"
                    id="form-error">
            </p>


            <button
                    type="submit"
                    class="button">
                Next →
            </button>

        </form>

    </section>

</main>


<footer class="site-footer">

    <nav class="footer-nav" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="breeds.html">Breeds</a>
        <a href="match.html">Find Your Match</a>
        <a href="favorites.html">♡ Favorites</a>
    </nav>

    <p>&copy; 2026 CATTALOG</p>

</footer>

</body>

</html>
