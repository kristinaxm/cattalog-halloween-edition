<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Find Your Match | CATTALOG</title>
</head>

<body>

<header class="site-header">

    <a href="index.html" class="logo">
        CATTALOG
    </a>

    <button
            type="button"
            class="nav-toggle"
            id="nav-toggle"
            aria-expanded="false"
            aria-controls="main-nav"
            aria-label="Open menu">
        ☰
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation">
        <a href="breeds.html">Breeds</a>
        <a href="match.html">Find Your Match</a>
        <a href="favorites.html">♡ Favorites</a>
    </nav>

</header>


<main>

    <section class="quiz-section">

        <header class="quiz-header">

            <p class="section-label">
                Cattalog Matchmaker
            </p>

            <h1>
                Find Your Match.
            </h1>

            <p>
                Five questions. No wrong answers.
                Find the characters that fit your lifestyle.
            </p>

        </header>


        <form id="match-form">

            <p class="quiz-progress">
                Loading question...
            </p>

            <fieldset>
                <!-- JavaScript adds the current question here -->
            </fieldset>

            <p
                    class="form-error"
                    id="form-error">
            </p>

            <button
                    type="submit"
                    class="button">
                Next →
            </button>

        </form>

    </section>

</main>


<footer class="site-footer">

    <nav class="footer-nav" aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="breeds.html">Breeds</a>
        <a href="match.html">Find Your Match</a>
        <a href="favorites.html">♡ Favorites</a>
    </nav>

    <p>&copy; 2026 CATTALOG</p>

</footer>

<script src="js/nav.js"></script>

</body>

</html>
