<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="See your best-matched cat breeds based on your CATTALOG quiz answers.">
    <link rel="icon" href="images/cat-on-skull.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Your Halloween Familiar | CATTALOG — Halloween Edition</title>
</head>

<body>

<header class="site-header" id="site-header">
</header>


<main>

    <section class="results-section">

        <header class="results-header">

            <img src="images/ghost-bone.svg" alt="" aria-hidden="true" class="page-decor decor-results-ghost" loading="lazy">

            <p class="section-label">
                Your Results
            </p>

            <h1>
                Your familiar has chosen you.
            </h1>

            <p>
                Based on your answers, these characters
                might be your kind of cats.
            </p>

        </header>


        <!-- BEST MATCH -->
        <article class="best-match" aria-labelledby="best-match-heading">

            <h2 id="best-match-heading" class="visually-hidden">Your best match</h2>

            <p class="match-label">
                Best Match
            </p>

            <p>
                Loading your matches...
            </p>

        </article>


        <!-- OTHER MATCHES -->
        <section class="more-matches">

            <img src="images/spider.png" alt="" aria-hidden="true" class="page-decor decor-more-matches-spider" loading="lazy">

            <h2>
                More Matches.
            </h2>

            <div
                    class="breed-grid"
                    id="match-results">

                <!--
                    JavaScript creates the remaining
                    quiz matches here.
                -->

            </div>

        </section>


        <!-- MATCH HISTORY -->
        <div class="quiz-history">

            <button
                    type="button"
                    class="history-toggle"
                    id="history-toggle"
                    aria-expanded="false"
                    aria-controls="match-history-panel"
                    hidden>
                View Past Matches
            </button>

        </div>

        <div
                class="match-history"
                id="match-history-panel"
                hidden>

            <div class="match-history-header">

                <h2>
                    Your Past Matches.
                </h2>

                <button
                        type="button"
                        class="clear-history-button"
                        id="clear-history-button"
                        hidden>
                    Clear History
                </button>

            </div>

            <div class="history-list" id="match-history-list">
                <!-- JavaScript adds past match entries here -->
            </div>

        </div>


        <a href="match.html">
            Retake Quiz →
        </a>

    </section>

</main>


<footer class="site-footer" id="site-footer">
</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/results.js"></script>
</body>

</html>
