<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and manage your saved favorite cat breeds on CATTALOG.">
    <link rel="icon" href="images/cat-on-skull.svg">
    <link rel="stylesheet" href="css/style.css">
    <title>Favorites | CATTALOG — Halloween Edition</title>
</head>

<body>

<header class="site-header" id="site-header">
</header>


<main>

    <section class="favorites-section">

        <img src="images/spider.png" alt="" aria-hidden="true" class="page-decor decor-favorites-spider" loading="lazy">
        <img src="images/spider2.png" alt="" aria-hidden="true" class="page-decor decor-favorites-spider2" loading="lazy">

        <header class="section-header">

            <p class="section-label">
                Saved
            </p>

            <h1>
                Your Favorites.
            </h1>

            <p>
                The characters that caught your eye.
            </p>

        </header>


        <h2 class="visually-hidden">Saved breeds</h2>

        <!--
            JavaScript reads Local Storage and
            creates the saved breed cards here.
        -->
        <div
                class="breed-grid"
                id="favorites-grid">

            <p class="empty-favorites">
                You haven't saved any favorites yet.
            </p>

        </div>


        <div class="favorites-actions">

            <a
                    href="breeds.html"
                    class="button">
                Explore Breeds
            </a>

            <button
                    type="button"
                    class="clear-favorites-button"
                    id="clear-favorites-button"
                    hidden>
                Clear All Favorites
            </button>

        </div>

    </section>

</main>


<footer class="site-footer" id="site-footer">
</footer>

<script src="js/nav.js"></script>
<script src="js/utils.js"></script>
<script src="js/favorites.js"></script>
</body>

</html>
